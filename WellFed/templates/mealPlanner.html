<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner - WellFed</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/mealPlanner.js" defer></script>
</head>
<body>
    <div>Hello from meal planner</div>
    <h1>List of individual meals in the system</h1>
        {% for i in single_meals %}
        <div>{{i.meal_name}}</div>
        <div>{{i.meal_description}}</div>
        <div>{{i.meal_type_choice}}</div>
        <div>{{i.calories}}calories</div>
        <div>{{i.protein}}g protien</div>
        <div>{{i.carbs}}g carbs</div>
        <div>{{i.fats}}g fats</div>
        <br>
        {% endfor %}
</body>
</html>
