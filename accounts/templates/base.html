<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meal Planner App{% endblock %}</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            /* Colorful gradient background */
            background: linear-gradient(135deg, #6a5acd, #ff7f50);
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Card container for all pages */
        .card {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;

            /* Soft shadow for symmetric design */
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);

            text-align: center;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            text-decoration: none;
            background: #6a5acd;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            margin: 0 5px;
            display: inline-block;
        }

        nav a:hover {
            background: #483d8b;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ff7f50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ff5722;
        }

        input {
            width: 90%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin: 10px 0;
        }

        label {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- navigation -->
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}">Signup</a>
            <a href="{% url 'budget' %}">Budget</a>
        </nav>

        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
