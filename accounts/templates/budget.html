{% extends "base.html" %}

{% block title %}Budget Tracker{% endblock %}

{% block content %}
<h1>Budget Tracker</h1>

<form id="budget-form">
    <label>Your Total Budget:</label><br>
    <input type="number" id="total-budget" required><br><br>

    <label>How much you are spending on groceries:</label><br>
    <input type="number" id="expenses" required><br><br>

    <button type="submit">Update Budget</button>
</form>

<div class="circle-container" style="margin-top:30px; text-align:center;">
    <svg width="200" height="200">
        <circle class="circle-bg" cx="100" cy="100" r="90" stroke="#eee" stroke-width="20" fill="none"/>
        <circle class="circle-progress" cx="100" cy="100" r="90" stroke="#6a5acd" stroke-width="20" fill="none" stroke-linecap="round" stroke-dasharray="565.48" stroke-dashoffset="565.48"/>
    </svg>
    <div class="circle-text" id="budget-text" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); font-size:24px; font-weight:bold;">$0 / $0</div>
</div>

<script>
    const form = document.getElementById('budget-form');
    const progressCircle = document.querySelector('.circle-progress');
    const budgetText = document.getElementById('budget-text');
    const radius = 90;
    const circumference = 2 * Math.PI * radius;

    progressCircle.style.strokeDasharray = circumference;
    progressCircle.style.strokeDashoffset = circumference;

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const totalBudget = parseFloat(document.getElementById('total-budget').value) || 0;
        const expenses = parseFloat(document.getElementById('expenses').value) || 0;

        let spent = expenses;
        if (spent > totalBudget) spent = totalBudget;

        const offset = circumference * (1 - spent / totalBudget);
        progressCircle.style.strokeDashoffset = offset;

        // Change color if over budget
        if (expenses > totalBudget) {
            progressCircle.style.stroke = 'red';
        } else {
            progressCircle.style.stroke = '#6a5acd';
        }

        budgetText.textContent = `$${expenses} / $${totalBudget}`;
    });
</script>
{% endblock %}
