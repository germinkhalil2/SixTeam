<!DOCTYPE html>
<html>
<head>
    <title>Budget Tracker</title>
</head>
<body>

    <h1>Budget Tracker</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Your Total Budget:</label><br>
        <input type="number" name="budget" required><br><br>

        <label>How much you are spending on groceries:</label><br>
        <input type="number" name="expenses" required><br><br>

        <button type="submit">Calculate</button>
    </form>

    {% if result %}
        <h2>Result:</h2>
        <p>{{ result }}</p>
    {% endif %}

</body>
</html>
